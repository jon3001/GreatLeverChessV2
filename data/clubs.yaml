# Great Lever Chess Club — Club Directory data (first-pass draft)
#
# Covers every club found across the five sources browsed:
#   - Manchester Chess Federation's own club directory (website)
#   - ECF LMS: Bolton & District Chess League (organisation/1097)
#   - ECF LMS: Central Lancashire League (organisation/779)
#   - ECF LMS: Manchester Chess Federation (organisation/1237)
#   - ECF LMS: East Lancashire Chess Association (organisation/671) — added
#     6 September 2026; missed in the first pass, four new clubs (Burnley,
#     Clitheroe, Great Harwood, Rossendale) plus 671 merged onto the existing
#     Crusaders Blackburn and Heywood records rather than duplicated.
#
# Great Lever Chess Club itself is deliberately excluded (this is a directory
# of OTHER clubs). ecflms_league_ids only ever contains 1097, 779, 1237
# and/or 671 — a club's membership of a league outside these five sources
# (Warrington & District, Wigan & District, Bury and Rochdale, Blackpool and
# Fylde, Stockport Chess League) was seen on several clubs' own pages but is
# not recorded here, since those leagues weren't part of this pass.
#
# local_junior_provision: boolean, optional (default false) — genuine
# junior/youth provision AND realistically local to Great Lever (Farnworth,
# Bolton). A judgement call, not derived from any source page — set only on
# Bolton Chess Club and Swinton & Worsley Community Chess Club, on Jonathan's
# own confirmation, 6 September 2026.
#
# Cross-checked 6 September 2026 against https://lancashirechess.uk/clubs/
# (covers East Lancashire/Central Lancashire-area clubs only, not MCF's).
# Filled Burnley's missing postcode and added a website for Preston and
# Rossendale (both Facebook, per that site's own listing) — see each
# record's `note`. Surfaced one genuine venue conflict for Clitheroe,
# flagged in its own `note` rather than resolved. Every `website` value in
# this file was also checked reachable via a real browser on 6 September
# 2026 — WebFetch itself reported several as unreachable (SSL/DNS/robots.txt
# errors), but all of those were false alarms from its own fetcher; every
# site loaded fine in a real browser.
#
# Addresses: generally MCF's own directory where a club is listed there,
# ECF LMS organisation page otherwise — with per-club corrections from
# Jonathan where the two sources disagreed (Swinton & Worsley, Atherton,
# Bolton use the LMS version; Heywood's venue name updated; Horwich and
# Wigan's venues came from outside these four sources entirely). See each
# record's own `note` field for details.
#
# ecf_club_code values were extracted from
# https://rating.englishchess.org.uk/clubs?assoc_code=All (5 September 2026).
# A few clubs have a second, asterisked entry on that list (e.g. "Bolton *")
# alongside the plain one used here — not investigated further.

